;METADATA=(Diff=true, UseCommands=true)
[CommonSettings]
ManifestDependencies=Content/Localization/Game/Game.manifest
ManifestDependencies=Mods/SML/Content/Localization/SML/SML.manifest
ManifestDependencies=Mods/GameFeatures/KBFL/Content/Localization/KBFL/KBFL.manifest
SourcePath=Mods/GameFeatures/NobleMetals/Content/Localization/NobleMetals
DestinationPath=Mods/GameFeatures/NobleMetals/Content/Localization/NobleMetals
ManifestName=NobleMetals.manifest
ArchiveName=NobleMetals.archive
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=ja
CulturesToGenerate=zh-Hans
CulturesToGenerate=de

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=%LOCPROJECTROOT%Mods/GameFeatures/NobleMetals/Config
ExcludePathFilters=Config/Localization/*
FileNameFilters=*.h
FileNameFilters=*.cpp
FileNameFilters=*.ini
ShouldGatherFromEditorOnlyData=false

[GatherTextStep1]
CommandletClass=GatherTextFromAssets
IncludePathFilters=%LOCPROJECTROOT%Mods/GameFeatures/NobleMetals/Content/*
ExcludePathFilters=Content/Localization/*
ExcludePathFilters=Content/L10N/*
PackageFileNameFilters=*.umap
PackageFileNameFilters=*.uasset
ShouldExcludeDerivedClasses=false
ShouldGatherFromEditorOnlyData=false
SkipGatherCache=false

[GatherTextStep2]
CommandletClass=GenerateGatherManifest

[GatherTextStep3]
CommandletClass=GenerateGatherArchive

[GatherTextStep4]
CommandletClass=GenerateTextLocalizationReport
bWordCountReport=true
WordCountReportName=NobleMetals.csv
bConflictReport=true
ConflictReportName=NobleMetals_Conflicts.txt

