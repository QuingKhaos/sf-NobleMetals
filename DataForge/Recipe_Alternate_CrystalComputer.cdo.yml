type: cdo
patches:
  - target: /Game/FactoryGame/Recipes/AlternateRecipes/Parts/Recipe_Alternate_Computer_2.Recipe_Alternate_Computer_2_C
    properties:
      - path: mIngredients[0].ItemClass
        value: /NobleMetals/Resources/Mainboard/Desc_Mainboard.Desc_Mainboard_C
      - path: mIngredients
        op: append
        value:
          ItemClass: /NobleMetals/Resources/CPU/Desc_CPU.Desc_CPU_C
          Amount: 1
      - path: mProducedIn
        value:
          - /Game/FactoryGame/Buildable/Factory/ManufacturerMk1/Build_ManufacturerMk1.Build_ManufacturerMk1_C
